# Services for SealedBid.
#
#   proof-server  — required for every network (Preview, Preprod, local).
#                   Generates the ZK proofs that submit transactions.
#   node/indexer  — local devnet only (`--network undeployed`).
#
# Public networks (Preview/Preprod) only need the proof server:
#   npm run proof-server:start
#
# Full local devnet:
#   docker compose up -d --wait
#   docker compose down -v

name: sealedbid

services:
  proof-server:
    # Pinned to the ledger-v8 line that Midnight.js 4.1.1 targets client-side.
    # Avoid 9.0.0-rc.x: those are pre-releases.
    image: midnightntwrk/proof-server:8.1.0
    container_name: sealedbid-proof-server
    # No -v: verbose mode eagerly prefetches every proving parameter at startup,
    # which is slow and fails outright on networks that rate-limit the burst.
    # Default (quiet) mode fetches each parameter on demand as proofs are built.
    command: ['midnight-proof-server']
    # The proof server downloads its proving parameters from srs.midnight.network
    # on first use, so it needs working outbound DNS and egress. The built-in
    # bridge network is used explicitly because user-defined bridge networks are
    # blocked from the public internet in some sandboxes and CI images, which
    # makes the parameter fetch fail with "Giving up" at startup.
    network_mode: bridge
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      # The image is distroless: /bin/sh exists but is not on PATH and there is
      # no curl/wget, so probe with the shell's /dev/tcp redirect.
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: sealedbid-node
    ports:
      - '9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    # "Healthy" means producing blocks, not merely serving HTTP: the probe asks
    # for the hash of block 1 and fails until it exists. The indexer refuses to
    # start while the chain is still at genesis.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -sf -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getBlockHash\",\"params\":[1]}' http://localhost:9944 | grep -q '\"result\":\"0x'",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s

  indexer:
    # 4.3.x ships an indexer whose config requires a Blockfrost key at boot; a
    # dummy value satisfies the loader on a local devnet. Do not bump to
    # 4.3.4/4.4.0 — those are pre-alpha builds for the ledger-9 line.
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: sealedbid-indexer
    restart: on-failure
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'local-devnet-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
